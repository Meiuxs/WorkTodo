<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WorkTodo</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__topline">
        <span id="today-label">今日</span>
        <button class="popup__open-dashboard" id="open-dashboard" type="button">↗ 工作台</button>
      </header>
      <h1>今天要做什么</h1>
      <div class="popup__summary" aria-label="今日完成摘要">
        <span id="summary-text">正在加载…</span><span class="progress" aria-hidden="true"><span id="progress-bar"></span></span>
      </div>
      <section class="task-section task-section--overdue" id="overdue-section" hidden aria-labelledby="overdue-heading">
        <h2 id="overdue-heading"></h2><ul class="task-list" id="overdue-list"></ul>
      </section>
      <section class="task-section" aria-labelledby="focus-heading">
        <h2 id="focus-heading">重点事项</h2><ul class="task-list" id="focus-list"></ul>
        <p class="empty" id="empty-state" hidden>今天暂时没有待办，先记录一件要做的事。</p>
      </section>
      <form class="popup__form" id="quick-create-form">
        <label class="sr-only" for="quick-title">记录一个新事项</label>
        <div class="popup__input-row">
          <input id="quick-title" name="title" autocomplete="off" maxlength="200" placeholder="记录一个新事项，按 Enter 保存……" required>
          <button class="popup__submit" type="submit" aria-label="添加任务">＋</button>
        </div>
        <div class="popup__date-options" aria-label="计划日期">
          <button class="date-option" type="button" data-date="today" aria-pressed="false">今天</button>
          <button class="date-option" type="button" data-date="tomorrow" aria-pressed="false">明天</button>
          <button class="date-option" type="button" data-date="inbox" aria-pressed="true">收集箱</button>
        </div>
        <p class="form-message" id="form-message" role="alert"></p>
      </form>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
