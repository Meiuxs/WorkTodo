<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WorkTodo 工作台</title>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <a class="skip-link" href="#view-root">跳到主要内容</a>
    <div class="app" hidden>
      <aside class="sidebar">
        <div class="brand-lockup">
          <p class="brand">WORKTODO</p>
          <p class="brand-note">记录 · 推进 · 回看</p>
        </div>
        <nav class="nav" aria-label="工作台导航">
          <div class="nav__group">
            <p class="nav__label">今天</p>
            <button type="button" data-route="today" aria-current="page">今天</button>
          </div>
          <div class="nav__group">
            <p class="nav__label">计划</p>
            <button type="button" data-route="tomorrow">明天</button>
            <button type="button" data-route="week">本周</button>
            <button type="button" data-route="month">月历</button>
          </div>
          <div class="nav__group">
            <p class="nav__label">任务</p>
            <button type="button" data-route="inbox">收集箱</button>
            <button type="button" data-route="resources">资料收集箱</button>
            <button type="button" data-route="all">全部任务</button>
            <button type="button" data-route="completed">已完成</button>
            <button type="button" data-route="trash">回收站</button>
          </div>
          <div class="nav__group">
            <p class="nav__label">回顾</p>
            <button type="button" data-route="history">工作记录</button>
          </div>
        </nav>
        <div class="nav__footer">
          <p class="nav__label">系统</p>
          <button class="nav__settings" type="button" data-route="settings">设置</button>
        </div>
      </aside>

      <main class="content">
        <header class="workspace-header">
          <div>
            <p class="workspace-date" id="workspace-date"></p>
            <h1 id="page-title">今日工作</h1>
            <p class="content__subtitle" id="page-subtitle">现在最需要推进的事项</p>
          </div>
        </header>

        <form class="quick-add" id="quick-add">
          <div class="quick-add__lead">
            <p class="eyebrow">快速记录</p>
            <span>只写标题，稍后再整理</span>
          </div>
          <div class="quick-add__row">
            <label class="sr-only" for="quick-add-title">记录一个新事项</label>
            <input id="quick-add-title" maxlength="200" autocomplete="off" placeholder="写下下一件要推进的事……" required>
            <button type="submit" class="button-primary" aria-label="添加">记录</button>
          </div>
          <div class="quick-add__options">
            <label class="sr-only" for="quick-add-date">计划日期</label>
            <select id="quick-add-date">
              <option value="inbox">先放收集箱</option>
              <option value="today">安排今天</option>
              <option value="tomorrow">安排明天</option>
              <option value="custom">指定日期</option>
            </select>
            <input class="quick-add__custom" id="quick-add-custom" type="date" hidden aria-label="指定计划日期">
            <button type="button" class="button-secondary" id="quick-add-more" aria-label="更多字段">补充详情</button>
          </div>
        </form>
        <p class="form-message" id="quick-add-message" role="alert"></p>

        <section class="view-root" id="view-root" tabindex="-1" aria-live="polite"></section>
      </main>
    </div>

    <dialog class="task-editor" id="task-editor">
      <form method="dialog">
        <header class="drawer-header">
          <div><p class="eyebrow">任务详情</p><h2 data-editor-title>新增任务</h2></div>
          <button type="button" class="icon-button" data-editor-close aria-label="关闭任务编辑器">×</button>
        </header>
        <div class="drawer-body">
          <p class="drawer-section-label">先确定</p>
          <label class="field">任务名称<input name="title" maxlength="200" required autofocus></label>
          <p class="field-hint">先填标题和计划日期，其他可以稍后补。</p>
          <div class="field-grid">
            <label class="field">计划日期<input name="scheduledDate" type="date"></label>
            <label class="field">优先级<select name="priority"><option value="none">无</option><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></label>
          </div>
          <p class="drawer-section-label drawer-section-label--spaced">组织任务</p>
          <label class="field">分类<select name="categoryId"></select></label>
          <fieldset class="recurring-picker" data-recurring-picker>
            <legend>重复任务</legend>
            <label class="check-field"><input name="recurring" type="checkbox"> 按规则自动创建下一项</label>
            <div class="field-grid" data-recurring-fields hidden>
              <label class="field">重复方式<select name="recurrenceFrequency"><option value="daily">每天</option><option value="weekdays">每个工作日</option><option value="weekly">每周</option><option value="monthly">每月</option><option value="yearly">每年</option><option value="custom">自定义间隔</option></select></label>
              <label class="field">间隔<input name="recurrenceInterval" type="number" min="1" max="90" value="1"></label>
              <label class="field" data-recurrence-unit>自定义单位<select name="recurrenceUnit"><option value="day">天</option><option value="week">周</option><option value="month">月</option></select></label>
            </div>
          </fieldset>
          <fieldset class="tag-picker" data-tag-picker>
            <legend>标签</legend>
            <div class="tag-picker__options" data-tag-options></div>
            <div class="tag-picker__create">
              <label for="new-tag">新标签</label>
              <input id="new-tag" maxlength="50">
              <button type="button" data-create-tag>创建标签</button>
            </div>
            <p class="form-message" data-tag-message role="alert"></p>
          </fieldset>
          <section class="editor-resources" data-editor-resources hidden>
            <div class="editor-section-heading"><h3>相关资料 <span class="editor-section-count" data-resource-count>0</span></h3><button type="button" class="button-secondary" data-resource-add>添加资料</button></div>
            <div class="editor-resource-list" data-resource-list></div>
          </section>
          <label class="check-field"><input name="starred" type="checkbox"> 标记为星标</label>
          <p class="drawer-section-label drawer-section-label--spaced">需要时再补充</p>
          <details class="editor-more">
            <summary>更多信息</summary>
            <label class="field">描述<textarea name="description" rows="4" maxlength="10000"></textarea></label>
            <div class="field-grid">
              <label class="field">开始时间<input name="startTime" type="time"></label>
              <label class="field">截止时间<input name="dueTime" type="time"></label>
            </div>
          </details>
          <section class="editor-subtasks" data-editor-subtasks hidden>
            <h3>子任务</h3>
            <div class="subtask-list" data-subtask-list></div>
            <div class="subtask-create">
              <label for="subtask-title">添加子任务</label>
              <input id="subtask-title" maxlength="200">
              <button type="button" data-subtask-create>添加子任务</button>
            </div>
            <p class="form-message" data-subtask-message role="alert"></p>
          </section>
          <p class="form-message" data-editor-message role="alert"></p>
          <div class="conflict-panel" data-editor-conflict hidden>
            <p>这个任务刚刚在另一个窗口更新过。你可以保留当前修改为新任务，或载入最新版本。</p>
            <div class="dialog-actions"><button type="button" data-editor-copy>保留为新任务</button><button type="button" class="button-primary" data-editor-reload>载入最新版本</button></div>
          </div>
        </div>
        <footer class="drawer-actions">
          <button type="button" data-editor-close>取消</button>
          <button type="submit" class="button-primary">保存任务</button>
        </footer>
      </form>
    </dialog>

    <dialog class="modal resource-dialog" id="resource-dialog">
      <form method="dialog" data-resource-form>
        <h2>添加资料</h2>
        <label class="field">资料类型<select data-resource-type aria-label="资料类型"><option value="url">网页链接</option><option value="snippet">文本片段</option><option value="file">本地文件</option></select></label>
        <label class="field">资料名称<input data-resource-title aria-label="资料名称" maxlength="200" required></label>
        <label class="field" data-resource-url-field>网页链接<input data-resource-url aria-label="网页链接" type="url" placeholder="https://" required></label>
        <label class="field" data-resource-snippet-field hidden>文本片段<textarea data-resource-content aria-label="文本片段" maxlength="20000"></textarea></label>
        <label class="field" data-resource-file-field hidden>本地文件<input data-resource-file type="file" aria-label="本地文件"></label>
        <label class="check-field" data-resource-copy-field hidden><input data-resource-save-copy type="checkbox"> 保存一份副本到本地（单个文件不超过 20 MB）</label>
        <label class="field">备注<textarea data-resource-note aria-label="资料备注" maxlength="2000" rows="2"></textarea></label>
        <p class="form-message" data-resource-message role="alert"></p>
        <div class="dialog-actions"><button type="button" data-resource-cancel>取消</button><button type="submit" class="button-primary">保存资料</button></div>
        <section class="resource-existing" data-resource-existing hidden>
          <h3>关联已有资料</h3><div data-resource-existing-list></div>
        </section>
      </form>
    </dialog>

    <dialog class="modal" id="confirm-dialog">
      <form method="dialog">
        <h2 data-confirm-title>确认操作</h2>
        <p data-confirm-message></p>
        <div class="dialog-actions"><button value="cancel">取消</button><button class="button-danger" value="confirm" data-confirm-submit>确认</button></div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
