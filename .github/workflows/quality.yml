name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Build extension package
        run: npm run package

      - name: Verify package policy
        run: npm run verify:package
